<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0f172a; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  background: #0f172a;
}
.accent-bar {
  width: 100%; height: 6pt;
  background: #f97316;
}
.content {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; margin: 0 60pt;
}
h1 { color: #ffffff; font-size: 36pt; margin: 0 0 8pt 0; }
.orange { color: #f97316; }
.subtitle { color: #94a3b8; font-size: 16pt; margin: 0 0 30pt 0; }
.tagline { color: #64748b; font-size: 11pt; margin: 0; }
.bottom-bar {
  margin: 0 60pt 30pt 60pt;
  height: 2pt; background: #1e293b;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="content">
  <h1>Design in <span class="orange">FlutterFlow</span>.</h1>
  <h1>Connect with <span class="orange">Code</span>.</h1>
  <p class="subtitle">The perfect pair: Visual speed meets custom power.</p>
  <p class="tagline">Custom Code Connect  |  AI-Powered Code Generation for FlutterFlow</p>
</div>
<div class="bottom-bar"></div>
</body>
</html>
